name: Build and Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          # Fetch pnpm's self-contained binary from GitHub releases rather than
          # shelling out to `npm install`. The npm path stalled for 6m45s on
          # run 33833060848, hung on npm's retired audit endpoint; standalone
          # takes the npm registry off the critical path entirely. It also drops
          # the redundant install-then-downgrade, since the npm installer pulled
          # latest and pnpm then self-switched to the packageManager pin.
          standalone: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # `pnpm run build` already ends in scripts/verify-build.mjs, so there is
      # no separate verification step.
      - name: Build and verify artifacts
        run: pnpm run build
        env:
          TURNSTILE_SITE_KEY: '0x4AAAAAACxasQskYMJsn7bk'

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Post-deploy smoke test
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          sleep 5
          failed=0
          for path in / /expertise /consultancy /work-experience /education /contact /privacy; do
            url="https://www.henriksoderlund.com${path}"
            tmpfile=$(mktemp)
            status=$(curl -s --compressed -o "$tmpfile" -w "%{http_code}" --max-time 15 "$url")
            size=$(wc -c < "$tmpfile")
            rm -f "$tmpfile"

            if [ "$status" -ne 200 ]; then
              echo "::error::FAIL: $url (HTTP $status)"
              failed=1
            elif [ "$size" -lt 1000 ]; then
              echo "::error::FAIL: $url (HTTP $status but only $size bytes - page is empty)"
              failed=1
            else
              echo "OK: $url ($status, $size bytes)"
            fi
          done

          echo "=== Checking API endpoints ==="
          for path in /health /llms.txt /sitemap-index.xml /sitemap-0.xml; do
            url="https://www.henriksoderlund.com${path}"
            tmpfile=$(mktemp)
            status=$(curl -s --compressed -o "$tmpfile" -w "%{http_code}" --max-time 10 "$url")
            size=$(wc -c < "$tmpfile")
            rm -f "$tmpfile"

            if [ "$status" -ne 200 ]; then
              echo "::error::FAIL: $url (HTTP $status)"
              failed=1
            elif [ "$size" -eq 0 ]; then
              echo "::error::FAIL: $url (HTTP $status but empty body)"
              failed=1
            else
              echo "OK: $url ($status, $size bytes)"
            fi
          done

          echo "=== Checking redirects ==="
          for path in /skills /blog /about; do
            url="https://www.henriksoderlund.com${path}"
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url")
            if [ "$status" -ne 301 ]; then
              echo "::error::FAIL: $url should return 301 (got HTTP $status)"
              failed=1
            else
              echo "OK: $url (301 redirect)"
            fi
          done

          echo "=== Checking redirects preserve UTM parameters ==="
          # A tagged link printed against a legacy path (an old /skills URL in a
          # CV) must keep its campaign tags across the 301, or the session is
          # counted as Direct. See docs/UTM-TAXONOMY.md.
          for path in /skills /consultation /blog/old-post; do
            url="https://www.henriksoderlund.com${path}?utm_source=resume&utm_medium=referral&utm_campaign=202608-cv&junk=1"
            loc=$(curl -s -o /dev/null -D - --max-time 10 "$url" | tr -d '\r' | awk 'tolower($1)=="location:"{print $2}')
            if ! echo "$loc" | grep -q "utm_source=resume.*utm_medium=referral.*utm_campaign=202608-cv"; then
              echo "::error::FAIL: $url dropped its UTM parameters (Location: $loc)"
              failed=1
            elif echo "$loc" | grep -q "junk=1"; then
              echo "::error::FAIL: $url carried a non-campaign parameter through (Location: $loc)"
              failed=1
            else
              echo "OK: $url (UTM preserved)"
            fi
          done

          echo "=== Checking defunct feed paths return 410 Gone ==="
          for path in /index.xml /feed /rss.xml; do
            url="https://www.henriksoderlund.com${path}"
            status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$url")
            if [ "$status" -ne 410 ]; then
              echo "::error::FAIL: $url should return 410 (got HTTP $status)"
              failed=1
            else
              echo "OK: $url (410 Gone)"
            fi
          done

          # Everything below runs inside src/worker.ts. The page checks above
          # pass even if the Worker stops adding headers entirely, because the
          # asset binding would still serve full-size HTML. These assert the
          # Worker actually executed.
          echo "=== Checking Worker-applied security headers ==="
          hdrs=$(mktemp)
          body=$(mktemp)
          curl -s --compressed -D "$hdrs" -o "$body" --max-time 15 "https://www.henriksoderlund.com/"

          nonce=$(grep -i '^content-security-policy:' "$hdrs" | grep -o "nonce-[a-f0-9-]*" | head -1 | sed 's/nonce-//')
          if [ -z "$nonce" ]; then
            echo "::error::FAIL: no CSP nonce in Content-Security-Policy header"
            failed=1
          elif ! grep -q "nonce=\"$nonce\"" "$body"; then
            echo "::error::FAIL: CSP nonce present but not injected into any script tag"
            failed=1
          else
            echo "OK: CSP nonce issued and injected into script tags"
          fi

          # Fou Analytics' anti-adblock scripts need eval(); see src/worker.ts.
          if grep -i '^content-security-policy:' "$hdrs" | grep -q "unsafe-eval"; then
            echo "OK: CSP retains 'unsafe-eval'"
          else
            echo "::error::FAIL: CSP lost 'unsafe-eval' - Fou Analytics will break"
            failed=1
          fi

          for header in strict-transport-security x-content-type-options referrer-policy x-frame-options; do
            if grep -qi "^${header}:" "$hdrs"; then
              echo "OK: ${header} present"
            else
              echo "::error::FAIL: ${header} missing"
              failed=1
            fi
          done
          rm -f "$hdrs" "$body"

          echo "=== Checking trailing-slash canonicalisation ==="
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "https://www.henriksoderlund.com/expertise/")
          if [ "$status" -ne 301 ]; then
            echo "::error::FAIL: /expertise/ should 301 to the non-slash form (got HTTP $status)"
            failed=1
          else
            echo "OK: /expertise/ (301 to non-slash)"
          fi

          # The measurement path is served by Cloudflare at the edge, ahead of the
          # Worker. If a Worker route ever shadows it, gtm.js 404s and measurement
          # stops silently, so assert the container actually loads - not just health.
          echo "=== Checking the Google tag gateway measurement path ==="
          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://www.henriksoderlund.com/wf0q/healthy")
          if [ "$status" -ne 200 ]; then
            echo "::error::FAIL: /wf0q/healthy should return 200 (got HTTP $status) - tag gateway is down"
            failed=1
          else
            echo "OK: /wf0q/healthy (200)"
          fi

          status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://www.henriksoderlund.com/wf0q/gtm.js?id=GTM-FWR4")
          if [ "$status" -ne 200 ]; then
            echo "::error::FAIL: /wf0q/gtm.js should return 200 (got HTTP $status) - GTM is not loading first-party"
            failed=1
          else
            echo "OK: /wf0q/gtm.js (200)"
          fi

          echo "=== Checking the contact Action responds ==="
          # Deliberately invalid input: expect a structured validation error,
          # which proves the Action route is bundled and reachable. A 404 or
          # 5xx means the Actions runtime did not survive the build.
          tmpfile=$(mktemp)
          status=$(curl -s -o "$tmpfile" -w "%{http_code}" --max-time 15 \
            -X POST "https://www.henriksoderlund.com/_actions/contact" \
            -H 'Origin: https://www.henriksoderlund.com' \
            -H 'Content-Type: application/x-www-form-urlencoded' \
            --data 'name=&email=not-an-email&message=x')
          if [ "$status" -ne 400 ] || ! grep -q "AstroActionInputError" "$tmpfile"; then
            echo "::error::FAIL: /_actions/contact returned HTTP $status without a validation error"
            cat "$tmpfile"
            failed=1
          else
            echo "OK: /_actions/contact (400 AstroActionInputError)"
          fi
          rm -f "$tmpfile"

          [ "$failed" -eq 0 ] || exit 1

      - name: Deployment Summary
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" << 'EOF'
          ## Deployment Successful

          | Page | URL |
          |------|-----|
          | Homepage | https://www.henriksoderlund.com/ |
          | Expertise | https://www.henriksoderlund.com/expertise |
          | Consultancy | https://www.henriksoderlund.com/consultancy |
          | Work Experience | https://www.henriksoderlund.com/work-experience |
          | Education | https://www.henriksoderlund.com/education |
          | Contact | https://www.henriksoderlund.com/contact |
          EOF
