allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Supply-chain cooldown guardrail: refuse deps published < 3 days ago (4320 min).
# Moved here from .npmrc so npm/npx stop warning about unknown config keys.
minimumReleaseAge: 4320
minimumReleaseAgeExclude: []
autoInstallPeers: true

# Security overrides for transitive dependencies that upstream still pins to
# vulnerable versions. Each entry clears an open Dependabot alert; drop an entry
# once the direct dependency's own range has moved past it.
overrides:
  # miniflare (via @cloudflare/vite-plugin) pins undici 7.24.8 - GHSA-4cwx-7wf7-3272 et al.
  undici@7: 7.29.0
  # miniflare + @cloudflare/vite-plugin pin ws 8.20.1 - GHSA-96hv-2xvq-fx4p.
  ws@8: 8.21.3
  # miniflare pins sharp 0.34.5 - GHSA-f88m-g3jw-g9cj.
  sharp@0.34: 0.35.3
  # astro resolves svgo 4.0.1 - GHSA-2p49-hgcm-8545.
  svgo@4: 4.1.0
  # ajv 8 pins fast-uri 3.1.5 - GHSA-jqff-g426-hqxp, GHSA-f65p-4m7j-42xc,
  # GHSA-fph4-wmhf-6fwf, GHSA-5jgf-p345-68v8.
  fast-uri@3: 3.1.6
